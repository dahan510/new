name: collect-sensor-data

on:
  schedule:
    # UTC 기준입니다. 21:00 UTC = 한국시간 06:00
    # ★ 주의: GitHub의 스케줄은 정시에 안 돌 때가 많습니다(최대 수십 분 지연).
    #   "정확히 매일 6시"가 필요한 작업이면 Actions는 맞지 않습니다.
    - cron: "0 21 * * *"
  workflow_dispatch:        # 버튼으로 수동 실행 (테스트용 — 이거 꼭 넣으세요)

# 저장소에 커밋하려면 쓰기 권한이 필요합니다
permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 센서 데이터 수집 (최근 24시간)
        run: python src/collector.py --minutes 1440

      - name: 수집 결과 확인
        run: |
          echo "=== data/history ==="
          ls -la data/history | tail -5
          python - <<'PY'
          import glob, pandas as pd
          files = sorted(glob.glob("data/history/*.csv"))
          n = sum(len(pd.read_csv(f)) for f in files)
          print(f"파일 {len(files)}개 / 누적 {n:,}행")
          assert n > 0, "수집된 행이 0입니다"
          PY

      - name: 모델 재학습 (데이터가 충분할 때만)
        continue-on-error: true      # ★ 학습이 실패해도 수집은 살립니다
        run: python src/train.py

      - name: 변경사항 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history models
          # 변경이 없으면 commit이 실패해서 워크플로가 빨개집니다 → 미리 걸러냅니다
          if git diff --staged --quiet; then
            echo "변경 없음. 커밋을 건너뜁니다."
          else
            git commit -m "chore(data): 센서 데이터 자동 수집 $(date -u +'%Y-%m-%d')"
            git push
          fi
